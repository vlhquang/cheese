<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Viện Cờ Vua Ô Tô</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif; background-color: #e0f7fa; text-align: center; margin: 0; padding: 20px; color: #333;
        }
        h1 { color: #ff5722; font-size: 2.2em; margin-bottom: 10px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            border: 2px solid #0288d1; background: #fff; color: #0288d1; border-radius: 10px; transition: 0.2s;
        }
        .tab-btn.active { background: #0288d1; color: #fff; box-shadow: 0 4px 0 #01579b; transform: translateY(-2px);}

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .dashboard { background: #fff; padding: 15px; border-radius: 15px; border: 3px solid #ff9800; width: 100%; max-width: 450px; }
        .dashboard h2 { margin: 5px 0; color: #4caf50; }
        .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: translateY(3px); }
        .btn-claim { background: #ff9800; box-shadow: 0 4px 0 #e65100; }
        
        .mascot-box { background: #fff9c4; padding: 15px; border-radius: 15px; border: 3px dashed #fbc02d; font-size: 1.1em; max-width: 450px; font-weight: bold; }
        .analysis-box { background: #ffcdd2; color: #c62828; padding: 10px; border-radius: 10px; display: none; max-width: 450px; font-weight: bold; border: 2px solid #c62828;}
        
        .lesson-note { background: #e3f2fd; color: #0277bd; padding: 15px; border-radius: 10px; border: 2px solid #81d4fa; max-width: 450px; text-align: left; display: none; font-size: 15px; line-height: 1.5;}
        .lesson-note h4 { margin: 0 0 8px 0; color: #01579b; font-size: 18px;}

        .board-wrapper { padding: 10px; background: #333; border-radius: 10px; border: 5px solid #ffeb3b; width: 400px; }
        
        .mode-controls { background: #fff; padding: 15px; border-radius: 10px; width: 100%; max-width: 450px; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);}
        .roadmap-grid { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; padding-right: 5px;}
        .category-header { background: #ffeb3b; color: #f57f17; font-weight: bold; padding: 8px; border-radius: 5px; margin-top: 10px; text-align: left; border-left: 5px solid #f57f17;}

        .highlight-select { background: rgba(255, 235, 59, 0.8) !important; }
        .highlight-move { background: radial-gradient(circle, #4caf50 25%, transparent 25%) !important; border-radius: 50%; }
        
        .tournament-setup input { padding: 5px; width: 50px; font-size: 16px; font-weight: bold; text-align: center; margin: 0 5px;}

        /* Hiệu ứng nhịp đập cho bài học đang được chọn */
        .active-lesson {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
    </style>
</head>
<body>

    <h1>🏎️ Học Viện Cờ Vua Ô Tô</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('roadmap')">🗺️ Lộ Trình Học</button>
        <button class="tab-btn" onclick="switchTab('ranked')">⭐ Đua Thăng Cấp (AI)</button>
        <button class="tab-btn" onclick="switchTab('tournament')">🏆 Giải Đấu</button>
    </div>

    <div class="container">
        <div class="dashboard">
            <h2>🪙 Ví: <span id="coinBalance">0</span> Xu</h2>
            <button class="btn btn-claim" onclick="claimSavings()">💰 Đổi 1000 Xu = 10k VNĐ</button>
        </div>

        <div class="lesson-note" id="lessonNote"></div>
        <div class="mascot-box" id="mascotText">🤖 Chọn bài học đầu tiên để bắt đầu nhé!</div>
        <div class="analysis-box" id="analysisText"></div>

        <div class="board-wrapper"><div id="board"></div></div>
        <div class="mode-controls" id="modeControls"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        // --- HỆ THỐNG LƯU TRỮ ---
        let coins = parseInt(localStorage.getItem('kidCoins')) || 0;
        let aiLevel = parseInt(localStorage.getItem('kidLevel')) || 1;
        let completedPuzzles = JSON.parse(localStorage.getItem('completedPuzzles')) || []; 
        document.getElementById('coinBalance').innerText = coins;

        function addCoins(amount) {
            coins += amount; localStorage.setItem('kidCoins', coins);
            document.getElementById('coinBalance').innerText = coins;
        }
        function claimSavings() {
            if (coins >= 1000) { addCoins(-1000); alert("🎉 Đổi thành công 10.000 VNĐ! Nhờ bố mẹ bỏ ống heo nhé!"); } 
            else { alert(`Cần thêm ${1000 - coins} Xu nữa!`); }
        }
        function mascotSpeak(text) { document.getElementById('mascotText').innerText = text; }
        function showAnalysis(text) { 
            let box = document.getElementById('analysisText');
            if(text) { box.style.display = 'block'; box.innerText = "🔍 Phân tích: " + text; } 
            else { box.style.display = 'none'; }
        }

        // --- DATA LỘ TRÌNH (Đã thêm Tốt phụ ở góc để chống lỗi Hòa cờ của Engine) ---
        const ROADMAP = [
            { 
                category: "Giai đoạn 1: Cách di chuyển",
                title: "Bài 1: Khởi động Tốt", 
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", targetMove: "e2e4", 
                note: "Quân Tốt như lính bộ binh. Lần đầu tiên, nó có thể bước lên 2 ô. <br><br><b>Nhiệm vụ:</b> Nhấp vào quân Tốt ở giữa (ô e2) và đẩy nó lên 2 bước (ô e4) để chiếm trung tâm!",
                mascot: "Đẩy Tốt lên e4 để mở đường nào!"
            },
            { 
                category: "Giai đoạn 1: Cách di chuyển",
                title: "Bài 2: Xe quét đường", 
                fen: "7k/7p/8/8/8/2R3r1/P7/K7 w - - 0 1", targetMove: "c3g3", 
                note: "Quân Xe đi theo <b>đường thẳng</b> (ngang hoặc dọc).<br><br><b>Nhiệm vụ:</b> Dùng Xe trắng (c3) lao thẳng tới tông hỏng Xe đen (g3).",
                mascot: "Đạp ga Xe tải trắng đâm thẳng vào Xe đen!"
            },
            { 
                category: "Giai đoạn 1: Cách di chuyển",
                title: "Bài 3: Tượng đi chéo", 
                fen: "7k/7p/4b3/8/2B5/8/P7/K7 w - - 0 1", targetMove: "c4e6", 
                note: "Quân Tượng di chuyển theo <b>đường chéo</b> (chữ X).<br><br><b>Nhiệm vụ:</b> Trượt quân Tượng trắng theo đường chéo để bắt Tượng đen.",
                mascot: "Tượng trắng đang nhắm trúng Tượng đen. Trượt chéo lên ăn nó!"
            },
            { 
                category: "Giai đoạn 1: Cách di chuyển",
                title: "Bài 4: Mã nhảy chữ L", 
                fen: "7k/7p/8/3p4/8/2N5/P7/K7 w - - 0 1", targetMove: "c3d5", 
                note: "Mã là quân duy nhất <b>có thể nhảy qua đầu</b> quân khác! Nó đi theo hình chữ L.<br><br><b>Nhiệm vụ:</b> Phi Mã (c3) theo hình chữ L lên bắt quân Tốt đen (d5).",
                mascot: "Phi ngựa theo chữ L để bắt quân Tốt đen!"
            },
            { 
                category: "Giai đoạn 1: Cách di chuyển",
                title: "Bài 5: Hậu uy quyền", 
                fen: "7k/7p/8/8/3r4/8/P7/Q3K3 w - - 0 1", targetMove: "a1d4", 
                note: "Hậu mang sức mạnh của cả Xe (đi thẳng) và Tượng (đi chéo).<br><br><b>Nhiệm vụ:</b> Hậu trắng (a1) đang nhìn thấy Xe đen (d4) theo đường chéo. Bay tới bắt ngay!",
                mascot: "Siêu xe Hậu trắng vút theo đường chéo lên bắt Xe đen!"
            },
            { 
                category: "Giai đoạn 2: Chiến thuật",
                title: "Bài 6: Đòn chĩa đôi", 
                fen: "4q1k1/7p/8/8/4N3/8/P7/6K1 w - - 0 1", targetMove: "e4f6", 
                note: "Dùng 1 quân tấn công 2 quân địch cùng lúc.<br><br><b>Nhiệm vụ:</b> Nhảy Mã trắng (e4) lên ô f6. Tại đây, Mã vừa 'Chiếu Vua' đen, vừa đe dọa ăn Hậu đen cùng một lúc!",
                mascot: "Nhảy Mã lên f6 để dọa 1 lúc cả Vua và Hậu đen!"
            },
            { 
                category: "Giai đoạn 2: Chiến thuật",
                title: "Bài 7: Đòn giằng", 
                fen: "4k3/4q2p/8/8/8/8/P7/R5K1 w - - 0 1", targetMove: "a1e1", 
                note: "Đòn 'Giằng' là trói chân quân địch.<br><br><b>Nhiệm vụ:</b> Kéo Xe trắng từ a1 sang e1. Hậu đen sẽ bị ghim chặt vì phải làm mộc che cho Vua!",
                mascot: "Kéo Xe sang e1 để trói chặt Hậu đen trước mặt Vua!"
            },
            { 
                category: "Giai đoạn 2: Chiến thuật",
                title: "Bài 8: Nhập thành", 
                fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQK2R w KQkq - 0 1", targetMove: "e1g1", 
                note: "Giấu Vua vào nơi an toàn.<br><br><b>Nhiệm vụ:</b> Nhấp vào Vua trắng (e1), rồi nhấp vào ô g1 để Nhập thành (Xe sẽ tự động nhảy qua bảo vệ).",
                mascot: "Giấu Vua vào góc an toàn! Nhấn Vua e1 rồi chọn g1."
            },
            { 
                category: "Giai đoạn 2: Chiến thuật",
                title: "Bài 9: Phong cấp", 
                fen: "7k/4P2p/8/8/8/8/P7/6K1 w - - 0 1", targetMove: "e7e8", 
                note: "Nếu Tốt đi đến tận cuối bản đồ phe địch, nó sẽ biến hình.<br><br><b>Nhiệm vụ:</b> Đẩy Tốt trắng lên e8 để biến nó thành Hậu!",
                mascot: "Đẩy Tốt lên e8 để biến hình thành Hậu mạnh mẽ!"
            },
            { 
                category: "Giai đoạn 3: Thực chiến",
                title: "Bài 10: Chiếu bí 1 nước", 
                fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 4 4", targetMove: "f3f7", 
                note: "Chiếu bí là khi Vua bị tấn công và không thể chạy trốn.<br><br><b>Nhiệm vụ:</b> Dùng Hậu trắng (f3) ăn vào ô f7 để chiếu bí Vua đen ngay lập tức!",
                mascot: "Dùng Hậu trắng ăn Tốt ở f7 để Chiếu bí ngay lập tức!"
            }
        ];

        // --- STATE ---
        var board = null, game = new Chess(), selectedSquare = null;
        let currentMode = 'roadmap', currentPuzzle = 0;
        let tourneyConfig = { rounds: 3, prize: 500, currentRound: 1, active: false };
        let autoNextTimeout = null;

        // --- RENDER TABS ---
        function switchTab(mode) {
            clearTimeout(autoNextTimeout); // Hủy tự động chuyển bài nếu chuyển tab
            currentMode = mode;
            $('.tab-btn').removeClass('active');$(`.tab-btn[onclick="switchTab('${mode}')"]`).addClass('active');
            showAnalysis(false);
            document.getElementById('lessonNote').style.display = (mode === 'roadmap') ? 'block' : 'none';
            
            let controls = document.getElementById('modeControls');
            if(mode === 'roadmap') {
                renderRoadmapUI();
                loadPuzzle(currentPuzzle); 
            } else if (mode === 'ranked') {
                controls.innerHTML = `<h3>Cấp độ AI hiện tại: Level ${aiLevel}</h3>
                    <button class="btn" style="background:#4caf50;" onclick="startRanked()">⚔️ Bắt đầu đấu hạng</button>`;
                mascotSpeak(`Sẵn sàng đua thực chiến ở Level ${aiLevel} chưa? Thắng sẽ lên cấp!`);
                game.reset(); board.position('start');
            } else if (mode === 'tournament') {
                tourneyConfig.active = false;
                controls.innerHTML = `<h3>Tạo Giải Đấu Cá Nhân</h3>
                    <div class="tournament-setup">
                        Số vòng: <input type="number" id="tRounds" value="3" min="1" max="10"> <br><br>
                        Thưởng Vô Địch: <input type="number" id="tPrize" value="500" step="50" min="100"> Xu
                    </div><br>
                    <button class="btn" style="background:#f44336;" onclick="startTournament()">🏁 Khai mạc giải</button>`;
                mascotSpeak("Thiết lập giải đấu của riêng con. Càng nhiều vòng, thưởng càng cao!");
                game.reset(); board.position('start');
            }
        }

        function renderRoadmapUI() {
            let controls = document.getElementById('modeControls');
            let html = `<h3>Bản Đồ Học Tập</h3><p style="font-size:14px; margin-top:-10px;">Hoàn thành bài <b>mới</b> để nhận 10 Xu!</p><div class="roadmap-grid">`;
            
            let currentCat = '';
            ROADMAP.forEach((p, i) => {
                if(p.category !== currentCat) {
                    html += `<div class="category-header">🏁 ${p.category}</div>`;
                    currentCat = p.category;
                }
                
                let isDone = completedPuzzles.includes(i);
                let isActive = (i === currentPuzzle);
                
                let btnStyle = isDone ? "background:#4caf50; border: 2px solid #388e3c;" : "background:#03a9f4; border: 2px solid #0288d1;";
                let icon = isDone ? "✅" : "▶️";
                let activeClass = isActive ? " active-lesson" : "";
                let activeText = isActive ? " (Đang học)" : "";
                
                if (isActive) {
                    btnStyle += " border-color: #ff9800; background: #ff9800;";
                    icon = "🎯"; 
                }

                html += `<button class="btn${activeClass}" style="${btnStyle}; text-align: left; margin-bottom: 5px;" onclick="loadPuzzle(${i})">
                            ${icon} ${p.title} ${activeText}
                         </button>`;
            });
            html += `</div>`;
            controls.innerHTML = html;
        }

        // --- GAMEPLAY ---
        function loadPuzzle(index) {
            clearTimeout(autoNextTimeout);
            currentPuzzle = index;
            let p = ROADMAP[index];
            
            game.load(p.fen);
            board.position(game.fen());
            
            document.getElementById('lessonNote').innerHTML = `<h4>📖 Hướng dẫn: ${p.title}</h4>${p.note}`;
            mascotSpeak(p.mascot);
            showAnalysis(false);
            removeHighlights();
            selectedSquare = null;
            
            if(currentMode === 'roadmap') renderRoadmapUI();
        }

        function startRanked() {
            game.reset(); board.position('start'); showAnalysis(false);
            mascotSpeak(`Trận đấu Level ${aiLevel} bắt đầu! Con cầm quân Trắng nhé!`);
        }

        function startTournament() {
            tourneyConfig.rounds = parseInt(document.getElementById('tRounds').value);
            tourneyConfig.prize = parseInt(document.getElementById('tPrize').value);
            tourneyConfig.currentRound = 1;
            tourneyConfig.active = true;
            nextTournamentRound();
        }

        function nextTournamentRound() {
            game.reset(); board.position('start'); showAnalysis(false);
            mascotSpeak(`🏆 VÒNG ${tourneyConfig.currentRound} / ${tourneyConfig.rounds} TRẬN BẮT ĐẦU!`);
            document.getElementById('modeControls').innerHTML = `<h3>🏆 Giải Đấu: Vòng ${tourneyConfig.currentRound}/${tourneyConfig.rounds}</h3><p>Thưởng vô địch: ${tourneyConfig.prize} Xu</p>`;
        }

        // --- BÀN CỜ CLICK-TO-MOVE ---
        function removeHighlights() { $('#board .square-55d63').removeClass('highlight-select highlight-move'); }
        function highlightValidMoves(square) {
            removeHighlights(); $('#board .square-' + square).addClass('highlight-select');
            var moves = game.moves({ square: square, verbose: true });
            for (var i = 0; i < moves.length; i++) { $('#board .square-' + moves[i].to).addClass('highlight-move'); }
        }

        $('#board').on('click', '.square-55d63', function () {
            // Loại bỏ Game Over Lock cho chế độ Roadmap (Chống lỗi nhận diện hòa cờ sai của thư viện)
            if (currentMode === 'roadmap') {
                if (game.turn() === 'b') return;
            } else {
                if (game.game_over() || game.turn() === 'b') return;
            }

            var square = $(this).attr('data-square');
            var piece = game.get(square);

            if (piece && piece.color === 'w') {
                selectedSquare = square; highlightValidMoves(square);
                return;
            }
            if (selectedSquare) {
                var attempt = selectedSquare + square; 
                
                // LOGIC ROADMAP (PUZZLE)
                if(currentMode === 'roadmap') {
                    if(attempt === ROADMAP[currentPuzzle].targetMove) {
                        game.move({from: selectedSquare, to: square, promotion: 'q'});
                        board.position(game.fen());
                        
                        if(!completedPuzzles.includes(currentPuzzle)) {
                            mascotSpeak("🎉 Chính xác! Tuyệt vời, con nhận được 10 Xu! (Tự chuyển bài tiếp sau 2s...)");
                            addCoins(10);
                            completedPuzzles.push(currentPuzzle);
                            localStorage.setItem('completedPuzzles', JSON.stringify(completedPuzzles));
                            renderRoadmapUI(); 
                            
                            // Auto next
                            if (currentPuzzle + 1 < ROADMAP.length) {
                                autoNextTimeout = setTimeout(() => loadPuzzle(currentPuzzle + 1), 2500);
                            }
                        } else {
                            mascotSpeak("🎉 Ôn tập bài rất tốt! Nhấn bài học khác để tiếp tục nhé!");
                        }
                        
                        removeHighlights(); selectedSquare = null;
                        return;
                    } else {
                        mascotSpeak("🛑 Kít! Nước đi này chưa đúng với hướng dẫn. Xem lại Ghi Chú nhé!");
                        removeHighlights(); selectedSquare = null;
                        return;
                    }
                }

                // LOGIC ĐẤU AI VÀ GIẢI ĐẤU
                var move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move === null) {
                    mascotSpeak("🛑 Sai luật cờ rồi con ơi!");
                } else {
                    board.position(game.fen()); removeHighlights(); selectedSquare = null;
                    mascotSpeak("🚙 Tốt lắm! Chờ máy tính đi...");
                    showAnalysis(false);
                    if (!checkGameOver()) { window.setTimeout(makeMachineMove, 600); }
                }
            }
        });

        // --- AI ĐỐI THỦ ---
        function makeMachineMove() {
            var moves = game.moves({ verbose: true });
            if (moves.length === 0) return;
            var captureMoves = moves.filter(m => m.captured);
            var chosenMove;
            
            let difficulty = (currentMode === 'ranked') ? (aiLevel * 0.15) : (tourneyConfig.currentRound * 0.2);
            if(difficulty > 0.9) difficulty = 0.9; 

            if (captureMoves.length > 0 && Math.random() < difficulty) {
                chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
            } else {
                chosenMove = moves[Math.floor(Math.random() * moves.length)];
            }

            game.move(chosenMove.san);
            board.position(game.fen());
            
            if(chosenMove.captured) {
                localStorage.setItem('lastCaptureByAI', `Máy vừa ăn quân ${chosenMove.captured} của con ở ô ${chosenMove.to}.`);
            } else {
                localStorage.setItem('lastCaptureByAI', '');
            }

            mascotSpeak("🤖 Tới lượt con!");
            checkGameOver();
        }

        // --- KẾT THÚC THỰC CHIẾN ---
        function checkGameOver() {
            if (game.game_over()) {
                if (game.in_checkmate()) {
                    if (game.turn() === 'b') { 
                        if(currentMode === 'ranked') {
                            aiLevel++; localStorage.setItem('kidLevel', aiLevel);
                            mascotSpeak(`🏆 QUÁN QUÂN! Con đã lên Level ${aiLevel}! (+30 Xu)`);
                            addCoins(30); switchTab('ranked');
                        } else if (currentMode === 'tournament') {
                            if(tourneyConfig.currentRound < tourneyConfig.rounds) {
                                tourneyConfig.currentRound++;
                                mascotSpeak("Thắng vòng này rồi! Chuẩn bị vòng tiếp theo nào!");
                                setTimeout(nextTournamentRound, 3000);
                            } else {
                                mascotSpeak(`🎉 VÔ ĐỊCH GIẢI ĐẤU! Bỏ túi ${tourneyConfig.prize} Xu!`);
                                addCoins(tourneyConfig.prize);
                                setTimeout(() => switchTab('tournament'), 4000);
                            }
                        }
                    } else { 
                        mascotSpeak("💥 Xe con bị kẹt mất rồi. Xem nguyên nhân bên dưới nhé!");
                        let reason = localStorage.getItem('lastCaptureByAI');
                        if(reason) {
                            showAnalysis(`Nguyên nhân thua: ${reason} Cách khắc phục: Hãy quan sát cẩn thận các quân chủ lực của mình có đang bị đối phương nhắm tới không trước khi đi nhé!`);
                        } else {
                            showAnalysis("Vua của con không được che chắn. Ở các ván sau, hãy nhớ Nhập Thành (đưa Vua vào góc) càng sớm càng tốt!");
                        }
                        if(currentMode === 'tournament') { tourneyConfig.active = false; setTimeout(() => switchTab('tournament'), 5000); }
                    }
                } else { 
                    mascotSpeak("🤝 Hòa cờ! (+5 Xu)"); addCoins(5);
                    if(currentMode === 'tournament') { tourneyConfig.active = false; switchTab('tournament'); }
                }
                return true;
            }
            return false;
        }

        var config = { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' };
        board = Chessboard('board', config);
        
        switchTab('roadmap'); 
    </script>
