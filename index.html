<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Viện Cờ Vua Ô Tô</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body { font-family: 'Nunito', sans-serif; background-color: #e0f7fa; text-align: center; margin: 0; padding: 20px; color: #333; }
        h1 { color: #ff5722; font-size: 2.2em; margin-bottom: 10px; }
        
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid #0288d1; background: #fff; color: #0288d1; border-radius: 10px; transition: 0.2s; }
        .tab-btn.active { background: #0288d1; color: #fff; box-shadow: 0 4px 0 #01579b; transform: translateY(-2px);}

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .dashboard { background: #fff; padding: 15px; border-radius: 15px; border: 3px solid #ff9800; width: 100%; max-width: 450px; }
        .dashboard h2 { margin: 5px 0; color: #4caf50; }
        .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
        .btn:active { transform: translateY(3px); }
        .btn-claim { background: #ff9800; box-shadow: 0 4px 0 #e65100; }
        
        .mascot-box { background: #fff9c4; padding: 15px; border-radius: 15px; border: 3px dashed #fbc02d; font-size: 1.1em; max-width: 450px; font-weight: bold; }
        .analysis-box { background: #ffcdd2; color: #c62828; padding: 10px; border-radius: 10px; display: none; max-width: 450px; font-weight: bold; border: 2px solid #c62828;}
        
        .lesson-note { background: #e3f2fd; color: #0277bd; padding: 15px; border-radius: 10px; border: 2px solid #81d4fa; max-width: 450px; text-align: left; display: none; font-size: 15px; line-height: 1.6;}
        .lesson-note h4 { margin: 0 0 8px 0; color: #01579b; font-size: 18px; display: flex; justify-content: space-between;}
        .step-badge { background: #ff9800; color: white; padding: 2px 8px; border-radius: 10px; font-size: 14px; }

        .board-wrapper { padding: 10px; background: #333; border-radius: 10px; border: 5px solid #ffeb3b; width: 400px; position: relative;}
        
        /* BẢN ĐỒ ĐỒ HỌA (WINDING ROAD) */
        .mode-controls { background: #fff; padding: 20px; border-radius: 10px; width: 100%; max-width: 450px; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden;}
        .map-container { position: relative; padding: 20px 0; display: flex; flex-direction: column; align-items: center; gap: 30px;}
        
        /* Đường kẻ trung tâm làm trục đường */
        .map-container::before {
            content: ''; position: absolute; top: 0; left: 50%; width: 12px; height: 100%; 
            background: repeating-linear-gradient(0deg, #9e9e9e, #9e9e9e 15px, #e0e0e0 15px, #e0e0e0 30px);
            transform: translateX(-50%); z-index: 1; border-radius: 6px;
        }

        .map-node-wrapper { display: flex; flex-direction: column; align-items: center; z-index: 2; position: relative; transition: 0.3s;}
        .map-node-wrapper:hover { transform: scale(1.05); }
        
        .map-node {
            background: #03a9f4; color: white; font-weight: bold; padding: 12px 20px; border-radius: 25px;
            border: 4px solid #fff; box-shadow: 0 6px 0 #0288d1, 0 8px 10px rgba(0,0,0,0.3);
            cursor: pointer; width: 220px; font-size: 15px; position: relative;
        }
        .map-node.completed { background: #4caf50; box-shadow: 0 6px 0 #388e3c, 0 8px 10px rgba(0,0,0,0.3); }
        .map-node.active-lesson { background: #ff9800; border-color: #ffe082; box-shadow: 0 6px 0 #f57c00, 0 8px 10px rgba(0,0,0,0.3); animation: pulse 1.5s infinite; }
        
        .map-stars { background: #fff; padding: 3px 10px; border-radius: 15px; margin-top: -10px; z-index: 3; border: 2px solid #ccc; font-size: 14px; letter-spacing: 2px;}
        .category-sign { background: #ffeb3b; color: #f57f17; font-weight: 900; padding: 5px 15px; border-radius: 10px; z-index: 2; border: 3px solid #f57f17; margin: 10px 0; text-transform: uppercase; font-size: 12px;}

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .highlight-select { background: rgba(255, 235, 59, 0.8) !important; }
        .highlight-move { background: radial-gradient(circle, #4caf50 25%, transparent 25%) !important; border-radius: 50%; }
        
        /* Modal Phong cấp */
        #promotionModal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 100; justify-content: center; align-items: center; border-radius: 5px;
        }
        .promotion-box { background: white; padding: 15px; border-radius: 15px; text-align: center; border: 4px solid #ff9800; }
        .promo-pieces { display: flex; gap: 10px; justify-content: center;}
        .promo-btn { width: 60px; height: 60px; background: #f5f5f5; border: 2px solid #ccc; border-radius: 10px; cursor: pointer; transition: 0.2s; background-size: 80%; background-position: center; background-repeat: no-repeat; }
        .promo-btn:hover { background-color: #e3f2fd; border-color: #2196f3; transform: scale(1.1); }
    </style>
</head>
<body>

    <h1>🏎️ Học Viện Cờ Vua Ô Tô</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('roadmap')">🗺️ Bản Đồ Học</button>
        <button class="tab-btn" onclick="switchTab('ranked')">⭐ Đua Thăng Cấp (AI)</button>
        <button class="tab-btn" onclick="switchTab('tournament')">🏆 Giải Đấu</button>
    </div>

    <div class="container">
        <div class="dashboard">
            <h2>🪙 Ví: <span id="coinBalance">0</span> Xu</h2>
            <button class="btn btn-claim" onclick="claimSavings()">💰 Đổi 500 Xu = 10k VNĐ</button>
        </div>

        <div class="lesson-note" id="lessonNote"></div>
        <div class="mascot-box" id="mascotText">🤖 Khởi động! Sẵn sàng thám hiểm Bản Đồ Cờ Vua chưa?</div>
        <div class="analysis-box" id="analysisText"></div>

        <div class="board-wrapper">
            <div id="board"></div>
            <div id="promotionModal">
                <div class="promotion-box">
                    <h3 style="margin: 0 0 10px 0; color: #d84315;">Chọn xe biến hình!</h3>
                    <div class="promo-pieces">
                        <div class="promo-btn" style="background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wQ.png');" onclick="confirmPromotion('q')"></div>
                        <div class="promo-btn" style="background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wR.png');" onclick="confirmPromotion('r')"></div>
                        <div class="promo-btn" style="background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wB.png');" onclick="confirmPromotion('b')"></div>
                        <div class="promo-btn" style="background-image: url('https://chessboardjs.com/img/chesspieces/wikipedia/wN.png');" onclick="confirmPromotion('n')"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Không gian cuộn (Map) -->
        <div class="mode-controls" id="modeControls" style="max-height: 500px; overflow-y: auto;"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        // --- ÂM THANH ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'move') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.1); gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'error') {
                osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.setValueAtTime(0, now + 0.1); osc.frequency.setValueAtTime(300, now + 0.2); gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.1); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
            }
        }
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        // --- LƯU TRỮ VÀ 3-STAR SYSTEM ---
        const MUC_DOI_TIEN = 500;
        let coins = parseInt(localStorage.getItem('kidCoins')) || 0;
        let aiLevel = parseInt(localStorage.getItem('kidLevel')) || 1;
        // Object lưu số sao của từng bài: { "0": 3, "1": 2, ... }
        let lessonStars = JSON.parse(localStorage.getItem('lessonStars')) || {}; 
        
        let currentLessonErrors = 0; // Biến đếm số lần sai trong bài học hiện tại

        document.getElementById('coinBalance').innerText = coins;

        function addCoins(amount) {
            coins += amount; localStorage.setItem('kidCoins', coins);
            document.getElementById('coinBalance').innerText = coins;
            if (amount > 0) playSound('coin');
        }
        function claimSavings() {
            if (coins >= MUC_DOI_TIEN) { addCoins(-MUC_DOI_TIEN); alert("🎉 Đổi thành công 10.000 VNĐ!"); } 
            else { alert(`Cần thêm ${MUC_DOI_TIEN - coins} Xu nữa!`); }
        }
        function mascotSpeak(text) { document.getElementById('mascotText').innerText = text; }
        function showAnalysis(text) { 
            let box = document.getElementById('analysisText');
            if(text) { box.style.display = 'block'; box.innerText = "🔍 " + text; } 
            else { box.style.display = 'none'; }
        }

        // --- DỮ LIỆU BÀI HỌC (THÊM BÀI MINIGAME SỐ 3) ---
        const ROADMAP = [
            { 
                category: "1. Vận hành cơ bản",
                title: "Trạm 1: Khởi động Tốt", 
                steps: [
                    { fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", targetMove: "e2e4", note: "👉 Nhấp vào Tốt Trắng ở e2 và đẩy lên e4.", mascot: "Đẩy Tốt lên 2 bước!" },
                    { fen: "rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2", targetMove: "e4d5", note: "👉 Tốt ăn chéo d5. Thử ngay!", mascot: "Tốt ăn chéo!" }
                ]
            },
            { 
                category: "1. Vận hành cơ bản",
                title: "Trạm 2: Siêu Xe Hậu", 
                steps: [
                    { fen: "7k/7p/8/8/8/8/P7/Q3K3 w - - 0 1", targetMove: "a1a8", note: "👉 Di chuyển Hậu trắng (a1) thẳng tắp lên a8.", mascot: "Hậu đi thẳng kịch trần ô a8!" },
                    { fen: "Q6k/7p/8/8/3r4/8/P7/4K3 w - - 0 1", targetMove: "a8d5", note: "👉 Ở ô a8, Hậu trắng nhìn thấy Xe đen d5 theo đường chéo. Bay tới ăn nó!", mascot: "Siêu xe Hậu trắng vút theo đường chéo!" }
                ]
            },
            { 
                category: "1. Vận hành cơ bản",
                title: "Trạm 3: Xe Tải Gom Rác (Minigame)", 
                steps: [
                    { fen: "7k/8/2p3p1/8/8/2R5/6p1/K7 w - - 0 1", targetMove: "c3c6", note: "<b>Minigame Ăn Liên Hoàn:</b> Quân Xe trắng (c3) phải ăn sạch 3 cọc tiêu (Tốt đen) trên đường thẳng.<br><br>👉 Bước 1: Lái Xe tông thẳng lên ăn Tốt ở c6.", mascot: "Lên số! Ăn Tốt c6 trước!" },
                    { fen: "7k/8/2R3p1/8/8/8/6p1/K7 w - - 0 1", targetMove: "c6g6", note: "👉 Bước 2: Bẻ lái sang ngang ăn tiếp Tốt g6.", mascot: "Bẻ lái sang phải, ăn g6!" },
                    { fen: "7k/8/6R1/8/8/8/6p1/K7 w - - 0 1", targetMove: "g6g2", note: "👉 Bước 3: Lùi xe thẳng xuống ăn nốt Tốt g2 để hoàn thành!", mascot: "Lùi xe đâm nát g2! Về đích!" }
                ]
            },
            { 
                category: "2. Luật Tôn Trọng",
                title: "Trạm 4: Biến Hình (Phong Cấp)", 
                steps: [
                    {
                        fen: "7k/4P2p/8/8/8/8/P7/6K1 w - - 0 1", targetMove: "e7e8", 
                        note: "Tốt đi đến vạch đích sẽ được biến hình. Con có thể tự do chọn Hậu, Xe, Mã, Tượng!<br><br>👉 Đẩy Tốt trắng lên e8 và <b>chọn xe biến hình!</b>", mascot: "Tiến lên vạch đích e8!"
                    }
                ]
            },
            { 
                category: "3. Ra Chiến Trường",
                title: "Trạm 5: Đòn Kết Liễu", 
                steps: [
                    { fen: "r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 4 4", targetMove: "f3f7", note: "👉 Dùng Hậu (f3) ăn Tốt f7 để chiếu bí.", mascot: "Lao thẳng vào ăn Tốt f7!" }
                ]
            }
        ];

        // --- STATE CHUNG ---
        var board = null, game = new Chess(), selectedSquare = null;
        let currentMode = 'roadmap', currentLessonIndex = 0, currentStepIndex = 0;
        let tourneyConfig = { rounds: 3, prize: 500, currentRound: 1, active: false };
        let autoNextTimeout = null;
        let pendingPromotionMove = null;

        // --- HÀM TẠO SỐ SAO HTML ---
        function getStarsHTML(score) {
            let html = '';
            for(let i=0; i<3; i++) {
                html += (i < score) ? '⭐' : '⚫';
            }
            return html;
        }

        // --- RENDER GIAO DIỆN BẢN ĐỒ ---
        function switchTab(mode) {
            clearTimeout(autoNextTimeout);
            currentMode = mode;
            $('.tab-btn').removeClass('active');$(`.tab-btn[onclick="switchTab('${mode}')"]`).addClass('active');
            showAnalysis(false);
            document.getElementById('lessonNote').style.display = (mode === 'roadmap') ? 'block' : 'none';
            document.getElementById('promotionModal').style.display = 'none';
            
            let controls = document.getElementById('modeControls');
            if(mode === 'roadmap') {
                renderRoadmapUI(); loadStep(currentLessonIndex, currentStepIndex); 
            } else if (mode === 'ranked') {
                controls.innerHTML = `<h3>Level AI: ${aiLevel}</h3><button class="btn" style="background:#4caf50;" onclick="startRanked()">⚔️ Đấu Hạng</button>`;
                mascotSpeak(`Sẵn sàng đua thực chiến ở Level ${aiLevel} chưa?`);
                game.reset(); board.position('start');
            } else if (mode === 'tournament') {
                tourneyConfig.active = false;
                controls.innerHTML = `<h3>Giải Đấu</h3>Số vòng: <input type="number" id="tRounds" value="3" min="1" max="10"> <br><br>Thưởng: <input type="number" id="tPrize" value="500" step="50" min="100"> Xu<br><br><button class="btn" style="background:#f44336;" onclick="startTournament()">🏁 Khai mạc</button>`;
                mascotSpeak("Thiết lập giải đấu của riêng con!");
                game.reset(); board.position('start');
            }
        }

        function renderRoadmapUI() {
            let controls = document.getElementById('modeControls');
            let html = `<h3 style="margin-top:0;">🗺️ Bản Đồ Thám Hiểm</h3><div class="map-container">`;
            
            let currentCat = '';
            // Mảng tạo hiệu ứng đường đi zig-zag
            let zigZagMargins = ['0 100px 0 0', '0 0 0 0', '0 0 0 100px', '0 0 0 0']; 
            
            ROADMAP.forEach((lesson, i) => {
                if(lesson.category !== currentCat) {
                    html += `<div class="category-sign">${lesson.category}</div>`;
                    currentCat = lesson.category;
                }
                
                let stars = lessonStars[i] || 0;
                let isActive = (i === currentLessonIndex);
                let isCompleted = stars > 0;
                
                let btnClass = isActive ? "map-node active-lesson" : (isCompleted ? "map-node completed" : "map-node");
                let icon = isActive ? "🚗" : (isCompleted ? "✅" : "🔒");
                let marginStyle = `margin: ${zigZagMargins[i % 4]};`;

                html += `<div class="map-node-wrapper" style="${marginStyle}">
                            <button class="${btnClass}" onclick="startLesson(${i})">
                                ${icon} ${lesson.title}
                            </button>
                            <div class="map-stars">${getStarsHTML(stars)}</div>
                         </div>`;
            });
            html += `</div>`;
            controls.innerHTML = html;

            // Tự động scroll tới bài đang học
            setTimeout(() => {
                let activeNode = document.querySelector('.active-lesson');
                if(activeNode) activeNode.scrollIntoView({ behavior: "smooth", block: "center" });
            }, 100);
        }

        // --- GAMEPLAY ROADMAP ---
        function startLesson(lessonIndex) {
            currentLessonIndex = lessonIndex; currentStepIndex = 0; 
            currentLessonErrors = 0; // Reset số lỗi khi bắt đầu lại bài
            loadStep(lessonIndex, 0);
        }

        function loadStep(lIndex, sIndex) {
            clearTimeout(autoNextTimeout);
            let lesson = ROADMAP[lIndex]; let step = lesson.steps[sIndex];
            game.load(step.fen); board.position(game.fen());
            
            let badge = `<span class="step-badge">Ví dụ ${sIndex + 1} / ${lesson.steps.length}</span>`;
            document.getElementById('lessonNote').innerHTML = `<h4><span>📖 Hướng dẫn</span> ${badge}</h4>${step.note}`;
            mascotSpeak(step.mascot); showAnalysis(false); removeHighlights(); selectedSquare = null;
            
            if(currentMode === 'roadmap') renderRoadmapUI();
        }

        // --- PHONG CẤP ---
        function confirmPromotion(pieceType) {
            document.getElementById('promotionModal').style.display = 'none';
            if (!pendingPromotionMove) return;
            let attemptStr = pendingPromotionMove.from + pendingPromotionMove.to;
            var move = game.move({ from: pendingPromotionMove.from, to: pendingPromotionMove.to, promotion: pieceType });
            pendingPromotionMove = null;
            if (move !== null) finalizeUserMove(attemptStr); 
        }

        function finalizeUserMove(attemptStr) {
            board.position(game.fen()); playSound('move');
            
            if(currentMode === 'roadmap') {
                let lesson = ROADMAP[currentLessonIndex];
                let step = lesson.steps[currentStepIndex];

                if(attemptStr.startsWith(step.targetMove)) {
                    if (currentStepIndex + 1 < lesson.steps.length) {
                        mascotSpeak("🚙 Tốt lắm! Đi tiếp nào...");
                        currentStepIndex++;
                        autoNextTimeout = setTimeout(() => loadStep(currentLessonIndex, currentStepIndex), 1000);
                    } else {
                        // KẾT THÚC BÀI HỌC VÀ TÍNH SAO
                        let earnedStars = 3;
                        if (currentLessonErrors === 1) earnedStars = 2;
                        if (currentLessonErrors >= 2) earnedStars = 1;

                        let previousStars = lessonStars[currentLessonIndex] || 0;
                        
                        if (earnedStars > previousStars) {
                            let xuThuong = (earnedStars - previousStars) * 10;
                            addCoins(xuThuong);
                            lessonStars[currentLessonIndex] = earnedStars;
                            localStorage.setItem('lessonStars', JSON.stringify(lessonStars));
                            mascotSpeak(`🎉 Hoàn hảo! Con đạt ${earnedStars} ⭐ và nhận thêm ${xuThuong} Xu!`);
                        } else {
                            mascotSpeak(`🎉 Con đã giải xong! Con giữ nguyên mức ${previousStars} ⭐. Cố gắng chơi lại mà không đi sai bước nào để lấy 3 sao nhé!`);
                        }
                        
                        renderRoadmapUI(); 
                        if (currentLessonIndex + 1 < ROADMAP.length) {
                            autoNextTimeout = setTimeout(() => startLesson(currentLessonIndex + 1), 3500);
                        }
                    }
                } else {
                    currentLessonErrors++; // Tăng biến đếm lỗi
                    playSound('error'); mascotSpeak("🛑 Kít! Nước đi này chưa đúng với hướng dẫn!");
                    game.undo(); board.position(game.fen()); 
                }
            } else {
                mascotSpeak("🚙 Tốt lắm! Chờ máy tính đi..."); showAnalysis(false);
                if (!checkGameOver()) { window.setTimeout(makeMachineMove, 600); }
            }
            removeHighlights(); selectedSquare = null;
        }

        // --- BÀN CỜ CLICK-TO-MOVE ---
        function removeHighlights() { $('#board .square-55d63').removeClass('highlight-select highlight-move'); }
        function highlightValidMoves(square) {
            removeHighlights(); $('#board .square-' + square).addClass('highlight-select');
            var moves = game.moves({ square: square, verbose: true });
            for (var i = 0; i < moves.length; i++) { $('#board .square-' + moves[i].to).addClass('highlight-move'); }
        }

        $('#board').on('click', '.square-55d63', function () {
            if (currentMode === 'roadmap' && game.turn() === 'b') return;
            if (currentMode !== 'roadmap' && (game.game_over() || game.turn() === 'b')) return;

            var square = $(this).attr('data-square');
            var piece = game.get(square);

            if (piece && piece.color === 'w') {
                selectedSquare = square; highlightValidMoves(square); return;
            }
            if (selectedSquare) {
                let testMove = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                
                if (testMove !== null) {
                    if (testMove.promotion) {
                        game.undo();
                        pendingPromotionMove = { from: selectedSquare, to: square };
                        document.getElementById('promotionModal').style.display = 'flex';
                        return;
                    } else {
                        let attemptStr = selectedSquare + square;
                        finalizeUserMove(attemptStr);
                    }
                } else {
                    playSound('error'); mascotSpeak("🛑 Sai luật cờ rồi con ơi!");
                    if(currentMode === 'roadmap') currentLessonErrors++; // Sai luật cũng bị trừ sao
                    removeHighlights(); selectedSquare = null;
                }
            }
        });

        // --- AI ĐỐI THỦ ---
        function makeMachineMove() {
            var moves = game.moves({ verbose: true });
            if (moves.length === 0) return;
            var captureMoves = moves.filter(m => m.captured);
            var chosenMove;
            let difficulty = (currentMode === 'ranked') ? (aiLevel * 0.15) : (tourneyConfig.currentRound * 0.2);
            if(difficulty > 0.9) difficulty = 0.9; 

            if (captureMoves.length > 0 && Math.random() < difficulty) {
                chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
            } else { chosenMove = moves[Math.floor(Math.random() * moves.length)]; }

            game.move(chosenMove.san); board.position(game.fen()); playSound('move');
            if(chosenMove.captured) { localStorage.setItem('lastCaptureByAI', `Máy vừa ăn ${chosenMove.captured} của con ở ô ${chosenMove.to}.`); } 
            else { localStorage.setItem('lastCaptureByAI', ''); }
            mascotSpeak("🤖 Tới lượt con!"); checkGameOver();
        }

        // --- THỰC CHIẾN (RANKED / TOURNAMENT) ---
        function startRanked() { game.reset(); board.position('start'); showAnalysis(false); mascotSpeak(`Trận đấu Level ${aiLevel} bắt đầu!`); }
        function startTournament() {
            tourneyConfig.rounds = parseInt(document.getElementById('tRounds').value); tourneyConfig.prize = parseInt(document.getElementById('tPrize').value);
            tourneyConfig.currentRound = 1; tourneyConfig.active = true; nextTournamentRound();
        }
        function nextTournamentRound() {
            game.reset(); board.position('start'); showAnalysis(false);
            document.getElementById('modeControls').innerHTML = `<h3>🏆 Vòng ${tourneyConfig.currentRound}/${tourneyConfig.rounds}</h3>`;
        }
        function checkGameOver() {
            if (game.game_over()) {
                if (game.in_checkmate()) {
                    if (game.turn() === 'b') { 
                        if(currentMode === 'ranked') { aiLevel++; localStorage.setItem('kidLevel', aiLevel); addCoins(30); switchTab('ranked'); } 
                        else if (currentMode === 'tournament') {
                            if(tourneyConfig.currentRound < tourneyConfig.rounds) { tourneyConfig.currentRound++; setTimeout(nextTournamentRound, 2000); } 
                            else { addCoins(tourneyConfig.prize); setTimeout(() => switchTab('tournament'), 2000); }
                        }
                    } else { 
                        mascotSpeak("💥 Xe con bị kẹt mất rồi.");
                        let reason = localStorage.getItem('lastCaptureByAI');
                        if(reason) showAnalysis(`Nguyên nhân thua: ${reason}`); else showAnalysis("Vua của con không được che chắn.");
                    }
                } else { mascotSpeak("🤝 Hòa cờ! (+5 Xu)"); addCoins(5); }
                return true;
            }
            return false;
        }

        var config = { draggable: false, position: 'start', pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png' };
        board = Chessboard('board', config); switchTab('roadmap'); 
    </script>
</body>
